spring:
  application:
    name: signalops-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/signalops}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  ai:
    model:
      chat: ollama
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3.5:4b
        think: false
        num-predict: 150
        temperature: 0

    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:google/gemma-4-26b-a4b-it:free}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never