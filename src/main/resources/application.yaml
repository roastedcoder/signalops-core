
spring:
  application:
    name: signalops-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/signalops}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: qwen3.5:4b
        think: false
        num-predict: 150
        temperature: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never
